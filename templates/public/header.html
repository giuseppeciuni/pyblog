<a class="skip-to-content" href="#content">$skip_content</a>
  <header class="site">
    <div class="site-header-inner">
      <div class="site-brand">
        $title_site
        <p class="site-subtitle">$subtitle</p>
      </div>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="menu-toggle-icona" aria-hidden="true">&#9776;</span> $label_menu
      </button>
      <nav class="site-nav" id="site-nav" aria-label="$aria_menu">
        <a href="$url_home">$label_home</a>
        <a href="${url_home}#articles">$label_articles</a>
        <a href="$url_archive">$label_archive</a>
        <a href="$url_feed" title="$title_rss">RSS</a>$entries_extra
        <a class="nav-lingua" href="$url_other_f_language" lang="$other_f_language" title="$other_f_language_name" aria-label="$other_f_language_name">$other_f_language_label</a>
        <button class="tema-toggle" type="button" onclick="toggleTheme()" aria-label="$aria_theme" title="$title_theme">
          <span class="tema-icona">&#9789;</span>
        </button>
      </nav>
    </div>
  </header>
