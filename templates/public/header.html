<a class="skip-to-content" href="#content">$salta_contenuto</a>
  <header class="site">
    <div class="site-header-inner">
      <div class="site-brand">
        $titolo_sito
        <p class="site-subtitle">$sottotitolo</p>
      </div>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="menu-toggle-icona" aria-hidden="true">&#9776;</span> $label_menu
      </button>
      <nav class="site-nav" id="site-nav" aria-label="$aria_menu">
        <a href="$url_home">$label_home</a>
        <a href="${url_home}#articles">$label_articoli</a>
        <a href="$url_archivio">$label_archivio</a>
        <a href="$url_feed" title="$title_rss">RSS</a>$voci_extra
        <a class="nav-lingua" href="$url_altra_lingua" lang="$altra_lingua" title="$altra_lingua_nome" aria-label="$altra_lingua_nome">$altra_lingua_label</a>
        <button class="tema-toggle" type="button" onclick="toggleTheme()" aria-label="$aria_tema" title="$title_tema">
          <span class="tema-icona">&#9789;</span>
        </button>
      </nav>
    </div>
  </header>
