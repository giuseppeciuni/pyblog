  <div class="consent" id="pb-consent" role="dialog" aria-modal="false" aria-labelledby="pb-consent-title" hidden>
    <div class="consent-inner">
      <button type="button" class="button button-icon button-text consent-close" data-consent="refuse" aria-label="$close" title="$close">&times;</button>
      <p class="consent-title" id="pb-consent-title">$title</p>
      <p class="consent-text">$text$privacy</p>
      <div class="consent-choices" id="pb-consent-choices" hidden>
        <label class="consent-item"><input type="checkbox" checked disabled> <span><strong>$label_needed_pl</strong> $hint_needed_pl</span></label>
$entries
      </div>
      <div class="consent-buttons">
        <button type="button" class="button button-primary consent-button" data-consent="refuse">$refuse</button>
        <button type="button" class="button consent-button" data-consent="customize">$customize</button>
        <button type="button" class="button consent-button" data-consent="save" hidden>$save</button>
        <button type="button" class="button button-primary consent-button consent-primary" data-consent="accept">$accept</button>
      </div>
    </div>
  </div>
