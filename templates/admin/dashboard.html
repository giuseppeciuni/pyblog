<div class="pagina">

  <div class="pagina-testata">
    <div>
      <h1 class="pagina-titolo">$label_articles</h1>
      <p class="pagina-sottotitolo">$overview</p>
    </div>
    <a class="pulsante pulsante-primario" href="/edit">$new_article</a>
  </div>

  <p class="avviso-aggiornamento" id="avviso-aggiornamento" role="status" hidden>
    <span id="avviso-aggiornamento-testo"></span>
    <a href="/updates">$label_see_update_notice</a>
  </p>

$first_steps_of_steps

  <div class="elenco-strumenti">
    <div class="segmenti" role="group" aria-label="$label_show" id="filtro-stato">
      <button type="button" class="segmento" aria-pressed="true" data-filtro="tutti" onclick="filterByStatus(this)">$label_all<span class="segmento-conta">$total</span></button>
      <button type="button" class="segmento" aria-pressed="false" data-filtro="1" onclick="filterByStatus(this)">$label_published_pl<span class="segmento-conta">$published_pl</span></button>
      <button type="button" class="segmento" aria-pressed="false" data-filtro="0" onclick="filterByStatus(this)">$label_drafts<span class="segmento-conta">$drafts</span></button>
      <button type="button" class="segmento" aria-pressed="false" data-filtro="s" onclick="filterByStatus(this)"$scheduled_pl_hidden_m>$label_scheduled_pl<span class="segmento-conta">$scheduled_pl</span></button>
    </div>
    <label for="search-box-admin" class="vh">$label_search</label>
    <input type="search" class="campo-input elenco-cerca" id="search-box-admin"
           placeholder="$label_search" oninput="filterArticles()">
    <div class="elenco-ordina">
      <label for="ordina-articoli">$label_sort</label>
      <select class="campo-input" id="ordina-articoli" onchange="sortArticles()">
        <option value="recenti">$sort_recent</option>
        <option value="vecchi">$sort_old</option>
        <option value="titolo">$sort_title</option>
        <option value="stato">$sort_state</option>
      </select>
    </div>
  </div>

  <div class="elenco-articoli" id="elenco-articoli">
$list
  </div>
  <p class="elenco-vuoto" id="nessun-risultato" hidden>$no_one_matches</p>
</div>
