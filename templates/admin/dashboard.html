<div class="pagina">

  <div class="pagina-testata">
    <div>
      <h1 class="pagina-titolo">$label_articoli</h1>
      <p class="pagina-sottotitolo">$riepilogo</p>
    </div>
    <a class="pulsante pulsante-primario" href="/edit">$nuovo_articolo</a>
  </div>

  <div class="elenco-strumenti">
    <div class="segmenti" role="group" aria-label="$label_mostra" id="filtro-stato">
      <button type="button" class="segmento" aria-pressed="true" data-filtro="tutti" onclick="filterByStatus(this)">$label_tutti<span class="segmento-conta">$totale</span></button>
      <button type="button" class="segmento" aria-pressed="false" data-filtro="1" onclick="filterByStatus(this)">$label_pubblicati<span class="segmento-conta">$pubblicati</span></button>
      <button type="button" class="segmento" aria-pressed="false" data-filtro="0" onclick="filterByStatus(this)">$label_bozze<span class="segmento-conta">$bozze</span></button>
      <button type="button" class="segmento" aria-pressed="false" data-filtro="s" onclick="filterByStatus(this)"$programmati_nascosto>$label_programmati<span class="segmento-conta">$programmati</span></button>
    </div>
    <label for="search-box-admin" class="vh">$label_cerca</label>
    <input type="search" class="campo-input elenco-cerca" id="search-box-admin"
           placeholder="$label_cerca" oninput="filterArticles()">
    <div class="elenco-ordina">
      <label for="ordina-articoli">$label_ordina</label>
      <select class="campo-input" id="ordina-articoli" onchange="sortArticles()">
        <option value="recenti">$ordina_recenti</option>
        <option value="vecchi">$ordina_vecchi</option>
        <option value="titolo">$ordina_titolo</option>
        <option value="stato">$ordina_stato</option>
      </select>
    </div>
  </div>

  <div class="elenco-articoli" id="elenco-articoli">
$elenco
  </div>
  <p class="elenco-vuoto" id="nessun-risultato" hidden>$nessun_corrisponde</p>
</div>
