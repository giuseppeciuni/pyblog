<div class="page">

  <div class="page-header">
    <div>
      <h1 class="page-title">$label_articles</h1>
      <p class="page-subtitle">$overview</p>
    </div>
    <a class="button button-primary" href="/edit">$new_article</a>
  </div>

  <p class="notice-update-notice" id="notice-update-notice" role="status" hidden>
    <span id="notice-update-notice-text"></span>
    <a href="/updates">$label_see_update_notice</a>
  </p>

$first_steps_of_steps

  <div class="list-tools">
    <div class="segments" role="group" aria-label="$label_show" id="filter-state">
      <button type="button" class="segment" aria-pressed="true" data-filter="all" onclick="filterByStatus(this)">$label_all<span class="segment-count">$total</span></button>
      <button type="button" class="segment" aria-pressed="false" data-filter="1" onclick="filterByStatus(this)">$label_published_pl<span class="segment-count">$published_pl</span></button>
      <button type="button" class="segment" aria-pressed="false" data-filter="0" onclick="filterByStatus(this)">$label_drafts<span class="segment-count">$drafts</span></button>
      <button type="button" class="segment" aria-pressed="false" data-filter="s" onclick="filterByStatus(this)"$scheduled_pl_hidden_m>$label_scheduled_pl<span class="segment-count">$scheduled_pl</span></button>
    </div>
    <label for="search-box-admin" class="vh">$label_search</label>
    <input type="search" class="field-input list-search" id="search-box-admin"
           placeholder="$label_search" oninput="filterArticles()">
    <div class="list-sort">
      <label for="sort-articles">$label_sort</label>
      <select class="field-input" id="sort-articles" onchange="sortArticles()">
        <option value="recent">$sort_recent</option>
        <option value="oldest">$sort_old</option>
        <option value="title">$sort_title</option>
        <option value="state">$sort_state</option>
      </select>
    </div>
  </div>

  <div class="list-articles" id="list-articles">
$list
  </div>
  <p class="list-empty" id="no-result" hidden>$no_one_matches</p>
</div>
