  <div class="group project-config">
    <div class="project-header">
      <label class="field-tick"><input type="checkbox" class="project-visible" $checked> <span>$label_visible</span></label>
      <div class="project-actions">
        <button type="button" class="button button-icon" onclick="moveProject(this, -1)" aria-label="$label_on_top" title="$label_on_top">$icon_on_top</button>
        <button type="button" class="button button-icon" onclick="moveProject(this, 1)" aria-label="$label_down" title="$label_down">$icon_down</button>
        <button type="button" class="button button-text item-danger" onclick="removeProject(this)">$label_delete</button>
      </div>
    </div>
    <label class="field-labelled"><span class="label-text">$label_name</span>
      <input type="text" class="project-name" value="$name" maxlength="120"></label>
    <div class="field">
      <label class="field-labelled"><span class="label-text">$label_description</span>
        <textarea class="project-description" rows="2" maxlength="240">$description</textarea></label>
      <p class="help">$hint_description</p>
    </div>
    <label class="field-labelled"><span class="label-text">$label_description_en</span>
      <textarea class="project-description-en" rows="2" maxlength="240">$description_en</textarea></label>
    <div class="field">
      <label class="field-labelled"><span class="label-text">$label_link</span>
        <input type="url" class="project-link" value="$link" placeholder="https://"></label>
      <p class="help">$hint_link</p>
    </div>
    <div class="field">
      <label class="field-labelled"><span class="label-text">$label_picture</span>
        <input type="text" class="project-picture" value="$picture" oninput="updateProjectPreview(this.closest('.project-config'))"></label>
      <p class="help">$hint_picture</p>
      <div class="actions">
        <button type="button" class="button" onclick="chooseProjectImage(this)">$label_upload</button>
        <span class="hint project-state" role="status"></span>
      </div>
      <img class="project-preview" alt="" hidden>
    </div>
  </div>
