<div class="access">
  <div class="group access-container">
    <p class="access-brand-mark">PyBlog</p>
    <h1 class="page-title">$title</h1>
    $notice
    <form method="POST" action="/login" class="access-form"$form_hidden>
      <p class="help">$invitation</p>
      <input type="hidden" name="action" value="forgot">
      <div class="field">
        <label for="email">$label_email</label>
        <input type="email" class="field-input" id="email" name="email" autocomplete="email" autofocus required>
      </div>
      <button type="submit" class="button button-primary button-wide">$label_send</button>
    </form>
    <p class="access-link"><a href="/login">$label_back</a></p>
  </div>
</div>
