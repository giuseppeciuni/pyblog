<div class="page page-narrow page-small">
  <div class="page-header">
    <div>
      <h1 class="page-title">$title</h1>
      <p class="page-subtitle">$subtitle</p>
    </div>
  </div>

  <div class="group">
    <h2>$label_from_file</h2>
    <p class="help" id="restoring-help">$hint_from_file</p>
    <div class="field">
      <label for="file-restoring">$label_choose_file</label>
      <input type="file" class="field-input" id="file-restoring" accept=".zip,application/zip"
             aria-describedby="restoring-help">
    </div>
    <div class="actions">
      <button type="button" class="button button-primary" id="button-restoring"
              onclick="restoreBackup(this)">$label_restore</button>
      <span class="hint" id="restoring-state" role="status"></span>
    </div>
  </div>

  <div class="group">
    <h2>$label_automatic_pl</h2>
    <p class="help">$hint_automatic_pl</p>
$list_automatic_pl
  </div>
</div>
