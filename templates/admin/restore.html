<div class="pagina pagina-stretta pagina-piccola">
  <div class="pagina-testata">
    <div>
      <h1 class="pagina-titolo">$title</h1>
      <p class="pagina-sottotitolo">$subtitle</p>
    </div>
  </div>

  <div class="gruppo">
    <h2>$label_from_file</h2>
    <p class="aiuto" id="ripristino-aiuto">$hint_from_file</p>
    <div class="campo">
      <label for="file-ripristino">$label_choose_file</label>
      <input type="file" class="campo-input" id="file-ripristino" accept=".zip,application/zip"
             aria-describedby="ripristino-aiuto">
    </div>
    <div class="azioni">
      <button type="button" class="pulsante pulsante-primario" id="pulsante-ripristino"
              onclick="restoreBackup(this)">$label_restore</button>
      <span class="hint" id="ripristino-stato" role="status"></span>
    </div>
  </div>

  <div class="gruppo">
    <h2>$label_automatic_pl</h2>
    <p class="aiuto">$hint_automatic_pl</p>
$list_automatic_pl
  </div>
</div>
