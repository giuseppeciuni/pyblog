<div class="access">
  <div class="group access-container">
    <p class="access-brand-mark">PyBlog</p>
    <h1 class="page-title">$title</h1>
    <p class="help">$invitation</p>
    $failure
    <form method="POST" action="/set-password" class="access-form">
      <div class="field">
        <label for="password">$label_new_f</label>
        <input type="password" class="field-input" id="password" name="password" autocomplete="new-password" minlength="6" aria-describedby="password-help" autofocus required>
        <p class="help" id="password-help">$hint_length_of</p>
      </div>
      <div class="field">
        <label for="confirm">$label_confirm</label>
        <input type="password" class="field-input" id="confirm" name="confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="button button-primary button-wide">$create_login</button>
    </form>
  </div>
</div>
