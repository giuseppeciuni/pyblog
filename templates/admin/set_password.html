<div class="accesso">
  <div class="gruppo accesso-scatola">
    <p class="accesso-marchio">PyBlog</p>
    <h1 class="pagina-titolo">$title</h1>
    <p class="aiuto">$invitation</p>
    $failure
    <form method="POST" action="/set-password" class="accesso-modulo">
      <div class="campo">
        <label for="password">$label_new_f</label>
        <input type="password" class="campo-input" id="password" name="password" autocomplete="new-password" minlength="6" aria-describedby="password-aiuto" autofocus required>
        <p class="aiuto" id="password-aiuto">$hint_length_of</p>
      </div>
      <div class="campo">
        <label for="conferma">$label_confirm</label>
        <input type="password" class="campo-input" id="conferma" name="conferma" autocomplete="new-password" required>
      </div>
      <button type="submit" class="pulsante pulsante-primario pulsante-largo">$create_login</button>
    </form>
  </div>
</div>
