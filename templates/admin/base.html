<!DOCTYPE html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$titolo_pagina</title>
<link href="$bootstrap_css" rel="stylesheet">
<link rel="stylesheet" href="/admin-static/common.css">
<link rel="stylesheet" href="/admin-static/admin.css">
$head_extra</head>
<body>
$navbar$contenuto

<!-- Shared UI pieces: toasts replace alert(), the modal replaces confirm().
     They live in the layout so every admin page can use them. -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="pb-toasts"></div>
<div class="modal fade" id="pb-confirm" tabindex="-1" aria-hidden="true"
     aria-labelledby="pb-confirm-title">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="pb-confirm-title"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal"
                aria-label="$label_chiudi"></button>
      </div>
      <div class="modal-body" id="pb-confirm-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">$label_annulla</button>
        <button type="button" class="btn btn-danger" id="pb-confirm-ok"></button>
      </div>
    </div>
  </div>
</div>

<script>
// Everything the admin JavaScript needs, handed over as JSON. No translated
// string and no page value is ever concatenated into a script: an Italian
// apostrophe would close the surrounding JavaScript string.
window.PB_I18N = $i18n;
window.PB_CSRF = $csrf;
window.PB_PAGE = $page_data;
</script>
<script src="$bootstrap_js"></script>
$script_extra<script src="/admin-static/admin.js"></script>
</body>
</html>
