<div class="access">
  <div class="group access-container">
    <p class="access-brand-mark">PyBlog</p>
    <h1 class="page-title">$title</h1>
    <p class="help">$invitation</p>
    $failure
    <form method="POST" action="/login" class="access-form">
      <div class="field">
        <label for="password">$label_password</label>
        <input type="password" class="field-input" id="password" name="password" autocomplete="current-password" autofocus required>
      </div>
      <button type="submit" class="button button-primary button-wide">$login</button>
    </form>
  </div>
</div>
