<div class="accesso">
  <div class="gruppo accesso-scatola">
    <p class="accesso-marchio">PyBlog</p>
    <h1 class="pagina-titolo">$title</h1>
    <p class="aiuto">$invitation</p>
    $failure
    <form method="POST" action="/login" class="accesso-modulo">
      <div class="campo">
        <label for="password">$label_password</label>
        <input type="password" class="campo-input" id="password" name="password" autocomplete="current-password" autofocus required>
      </div>
      <button type="submit" class="pulsante pulsante-primario pulsante-largo">$login</button>
    </form>
  </div>
</div>
