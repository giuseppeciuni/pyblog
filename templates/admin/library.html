<div class="pagina">

  <div class="pagina-testata">
    <div>
      <h1 class="pagina-titolo">$title</h1>
      <p class="pagina-sottotitolo">$overview</p>
    </div>
    <div class="azioni">
      <input type="file" id="libreria-file" hidden multiple accept="image/*,video/mp4,video/webm"
             onchange="uploadToLibrary(this)">
      <button type="button" class="pulsante pulsante-primario" id="libreria-carica"
              onclick="document.getElementById('libreria-file').click()">$label_upload</button>
    </div>
  </div>

  <div class="elenco-strumenti">
    <div class="segmenti" role="group" aria-label="$label_show" id="filtro-media">
      <button type="button" class="segmento" aria-pressed="true" data-filtro="tutti" onclick="filterMedia(this)">$label_all<span class="segmento-conta">$total</span></button>
      <button type="button" class="segmento" aria-pressed="false" data-filtro="1" onclick="filterMedia(this)">$label_used_pl<span class="segmento-conta">$used_pl</span></button>
      <button type="button" class="segmento" aria-pressed="false" data-filtro="0" onclick="filterMedia(this)">$label_not_used_pl<span class="segmento-conta">$not_used_pl</span></button>
    </div>
    <label for="cerca-media" class="vh">$label_search</label>
    <input type="search" class="campo-input elenco-cerca" id="cerca-media" placeholder="$label_search" oninput="filterMedia()">
    <button type="button" class="pulsante" onclick="deleteUnusedMedia(this)"$cleanup_hidden_f>$label_cleanup</button>
  </div>
  <p class="hint" id="libreria-stato" role="status"></p>

  <ul class="libreria-griglia" id="libreria-griglia">
$cards
  </ul>
  <p class="elenco-vuoto" id="libreria-vuota"$empty_f_hidden_f>$label_empty_f</p>
  <p class="elenco-vuoto" id="libreria-nessun-risultato" hidden>$label_no_one_outcome</p>
  <p class="aiuto">$hint_trash</p>
</div>
