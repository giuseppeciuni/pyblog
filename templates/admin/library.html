<div class="page">

  <div class="page-header">
    <div>
      <h1 class="page-title">$title</h1>
      <p class="page-subtitle">$overview</p>
    </div>
    <div class="actions">
      <input type="file" id="media-library-file" hidden multiple accept="image/*,video/mp4,video/webm"
             onchange="uploadToLibrary(this)">
      <button type="button" class="button button-primary" id="media-library-upload"
              onclick="document.getElementById('media-library-file').click()">$label_upload</button>
    </div>
  </div>

  <div class="list-tools">
    <div class="segments" role="group" aria-label="$label_show" id="filter-media">
      <button type="button" class="segment" aria-pressed="true" data-filter="all" onclick="filterMedia(this)">$label_all<span class="segment-count">$total</span></button>
      <button type="button" class="segment" aria-pressed="false" data-filter="1" onclick="filterMedia(this)">$label_used_pl<span class="segment-count">$used_pl</span></button>
      <button type="button" class="segment" aria-pressed="false" data-filter="0" onclick="filterMedia(this)">$label_not_used_pl<span class="segment-count">$not_used_pl</span></button>
    </div>
    <label for="search-media" class="vh">$label_search</label>
    <input type="search" class="field-input list-search" id="search-media" placeholder="$label_search" oninput="filterMedia()">
    <button type="button" class="button" onclick="mergeDuplicateMedia(this, $copies)"$merge_hidden_f>$label_merge</button>
    <button type="button" class="button" onclick="deleteUnusedMedia(this)"$cleanup_hidden_f>$label_cleanup</button>
  </div>
  <p class="hint" id="media-library-state" role="status"></p>

  <ul class="media-library-grid" id="media-library-grid">
$cards
  </ul>
  <div class="media-more">
    <p class="hint" id="media-library-count" aria-live="polite"></p>
    <button type="button" class="button" id="media-library-more" hidden onclick="showMoreMedia()">$label_more</button>
  </div>
  <p class="list-empty" id="media-library-empty"$empty_f_hidden_f>$label_empty_f</p>
  <p class="list-empty" id="media-library-no-result" hidden>$label_no_one_outcome</p>
  <p class="help">$hint_trash</p>
</div>
