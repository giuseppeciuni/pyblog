<div class="pagina pagina-stretta pagina-piccola">
  <div class="pagina-testata">
    <div>
      <h1 class="pagina-titolo">$titolo</h1>
      <p class="pagina-sottotitolo">$sottotitolo</p>
    </div>
  </div>
  $errore
  $successo
  <form method="POST" action="/change-password" class="gruppo">
    <input type="hidden" name="csrf_token" value="$csrf_token">
    <div class="campo">
      <label for="attuale">$label_attuale</label>
      <input type="password" class="campo-input" id="attuale" name="attuale" autocomplete="current-password" required>
    </div>
    <div class="campo">
      <label for="nuova">$label_nuova</label>
      <input type="password" class="campo-input" id="nuova" name="nuova" autocomplete="new-password" minlength="6" aria-describedby="nuova-aiuto" required>
      <p class="aiuto" id="nuova-aiuto">$hint_lunghezza</p>
    </div>
    <div class="campo">
      <label for="conferma">$label_conferma</label>
      <input type="password" class="campo-input" id="conferma" name="conferma" autocomplete="new-password" required>
    </div>
    <div class="azioni">
      <button type="submit" class="pulsante pulsante-primario">$titolo</button>
    </div>
  </form>
</div>
