<div class="pb-content" style="max-width:480px;">
  <div class="card pb-card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">$titolo</h1>
      $errore
      $successo
      <form method="POST" action="/change-password">
        <input type="hidden" name="csrf_token" value="$csrf_token">
        <div class="mb-3">
          <label for="attuale" class="form-label fw-semibold">$label_attuale</label>
          <input type="password" class="form-control" id="attuale" name="attuale">
        </div>
        <div class="mb-3">
          <label for="nuova" class="form-label fw-semibold">$label_nuova</label>
          <input type="password" class="form-control" id="nuova" name="nuova">
        </div>
        <div class="mb-3">
          <label for="conferma" class="form-label fw-semibold">$label_conferma</label>
          <input type="password" class="form-control" id="conferma" name="conferma">
        </div>
        <button type="submit" class="btn btn-primary">$titolo</button>
      </form>
    </div>
  </div>
</div>
