<div class="page page-narrow page-small">
  <div class="page-header">
    <div>
      <h1 class="page-title">$title</h1>
      <p class="page-subtitle">$subtitle</p>
    </div>
  </div>
  $failure
  $success
  <form method="POST" action="/change-password" class="group">
    <input type="hidden" name="csrf_token" value="$csrf_token">
    <div class="field">
      <label for="current">$label_current</label>
      <input type="password" class="field-input" id="current" name="attuale" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new">$label_new_f</label>
      <input type="password" class="field-input" id="new" name="nuova" autocomplete="new-password" minlength="6" aria-describedby="new-help" required>
      <p class="help" id="new-help">$hint_length_of</p>
    </div>
    <div class="field">
      <label for="confirm">$label_confirm</label>
      <input type="password" class="field-input" id="confirm" name="conferma" autocomplete="new-password" required>
    </div>
    <div class="actions">
      <button type="submit" class="button button-primary">$title</button>
    </div>
  </form>
</div>
