    <div class="riga-articolo articolo-card" data-titolo="$title_lowercase"
         data-data="$data_iso" data-stato="$order_state">
      <span class="riga-stato"><span class="pill $css_class_pill"><span class="pill-pallino"></span>$label_text_state</span></span>
      <div class="riga-testo">
        <a class="riga-titolo" href="/edit?slug=$slug">$title</a>
        <span class="riga-meta">$data &middot; <span class="pb-reading-time">$time_reading</span>$also_in</span>
      </div>
      <a class="pulsante riga-modifica" href="/edit?slug=$slug">$label_edit</a>
      <div class="riga-menu">
        <button type="button" class="pulsante pulsante-icona" id="azioni-$number"
                aria-haspopup="menu" aria-expanded="false" aria-controls="menu-$number"
                aria-label="$label_others_f_actions" onclick="toggleRowMenu(this)">$icon_other</button>
        <div class="menu-tendina" role="menu" id="menu-$number" aria-labelledby="azioni-$number" hidden>
          <a role="menuitem" tabindex="-1" href="/preview?slug=$slug" target="_blank" rel="noopener">$label_preview<span class="icona-esterna" aria-hidden="true"></span></a>
          $link_preview_language
          <button role="menuitem" tabindex="-1" type="button" onclick="changeStatus(this, $slug_js, $action_state_js)">$label_text_action_state</button>
          $entry_cancel_scheduling
          <div class="menu-tendina-separatore" role="separator"></div>
          <button role="menuitem" tabindex="-1" type="button" class="voce-pericolo" onclick="deleteArticle($slug_js, $title_js)">$label_delete</button>
        </div>
      </div>
    </div>
