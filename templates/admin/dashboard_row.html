    <div class="riga-articolo articolo-card" data-titolo="$titolo_minuscolo"
         data-data="$data_iso" data-stato="$ordine_stato">
      <span class="riga-stato"><span class="pill $classe_pill"><span class="pill-pallino"></span>$etichetta_stato</span></span>
      <div class="riga-testo">
        <a class="riga-titolo" href="/edit?slug=$slug">$titolo</a>
        <span class="riga-meta">$data &middot; <span class="pb-reading-time">$tempo_lettura</span>$anche_in</span>
      </div>
      <a class="pulsante riga-modifica" href="/edit?slug=$slug">$label_modifica</a>
      <div class="riga-menu">
        <button type="button" class="pulsante pulsante-icona" id="azioni-$numero"
                aria-haspopup="menu" aria-expanded="false" aria-controls="menu-$numero"
                aria-label="$label_altre_azioni" onclick="toggleRowMenu(this)">$icona_altro</button>
        <div class="menu-tendina" role="menu" id="menu-$numero" aria-labelledby="azioni-$numero" hidden>
          <a role="menuitem" tabindex="-1" href="/preview?slug=$slug" target="_blank" rel="noopener">$label_anteprima<span class="icona-esterna" aria-hidden="true"></span></a>
          $link_anteprima_lingua
          <button role="menuitem" tabindex="-1" type="button" onclick="changeStatus(this, $slug_js, $azione_stato_js)">$etichetta_azione_stato</button>
          <div class="menu-tendina-separatore" role="separator"></div>
          <button role="menuitem" tabindex="-1" type="button" class="voce-pericolo" onclick="deleteArticle($slug_js, $titolo_js)">$label_elimina</button>
        </div>
      </div>
    </div>
