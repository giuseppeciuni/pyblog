    <div class="row-article article-card" data-title="$title_lowercase"
         data-date="$data_iso" data-state="$order_state">
      <span class="row-state"><span class="pill $css_class_pill"><span class="pill-dot"></span>$label_text_state</span></span>
      <div class="row-text">
        <a class="row-title" href="/edit?slug=$slug">$title</a>
        <span class="row-meta">$data &middot; <span class="pb-reading-time">$time_reading</span>$also_in</span>
      </div>
      <a class="button row-edit" href="/edit?slug=$slug">$label_edit</a>
      <div class="row-menu">
        <button type="button" class="button button-icon" id="azioni-$number"
                aria-haspopup="menu" aria-expanded="false" aria-controls="menu-$number"
                aria-label="$label_others_f_actions" onclick="toggleRowMenu(this)">$icon_other</button>
        <div class="menu-dropdown" role="menu" id="menu-$number" aria-labelledby="azioni-$number" hidden>
          <a role="menuitem" tabindex="-1" href="/preview?slug=$slug" target="_blank" rel="noopener">$label_preview<span class="icon-external" aria-hidden="true"></span></a>
          $link_preview_language
          <button role="menuitem" tabindex="-1" type="button" onclick="changeStatus(this, $slug_js, $action_state_js)">$label_text_action_state</button>
          $entry_cancel_scheduling
          <div class="menu-dropdown-separator" role="separator"></div>
          <button role="menuitem" tabindex="-1" type="button" class="item-danger" onclick="deleteArticle($slug_js, $title_js)">$label_delete</button>
        </div>
      </div>
    </div>
