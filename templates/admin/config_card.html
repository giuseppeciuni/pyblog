  <div class="group card-config" data-index="$toc_index">
    <div class="field-tick">
      <input type="checkbox" class="card-active" id="card-attiva-$toc_index" $checked>
      <div><label for="card-attiva-$toc_index">$label_show</label></div>
    </div>
    <div class="field">
      <label for="card-titolo-$toc_index">$label_title</label>
      <input class="field-input card-title" type="text" id="card-titolo-$toc_index" value="$title">
    </div>
    <p class="field-title" id="card-contenuto-$toc_index">$label_content</p>
    <div class="card-editor" id="card-editor-$toc_index" aria-labelledby="card-contenuto-$toc_index"></div>
  </div>
