<div class="page page-narrow page-small">
  <div class="page-header">
    <div>
      <h1 class="page-title">$title</h1>
      <p class="page-subtitle">$version_installed</p>
    </div>
  </div>

  <div class="group">
    <h2>$label_state</h2>
    <p class="updates-state" id="updates-state" role="status">$label_checking</p>
    <ul class="updates-news" id="updates-news" hidden></ul>
    <p class="help" id="updates-instructions" hidden>$instructions</p>
    <div class="actions">
      <button type="button" class="button button-primary" id="update-now" hidden
              onclick="installUpdate(this)">$label_update</button>
      <button type="button" class="button" onclick="checkUpdates(true)">$label_check_now</button>
    </div>
    <p class="help" id="update-help" hidden>$hint_update</p>
  </div>

  <div class="group">
    <h2>$label_automatic</h2>
    <div class="field-tick">
      <input type="checkbox" id="automatic-check" aria-describedby="automatic-check-help"
             onchange="setAutomaticCheck(this)" $checked_automatic>
      <div>
        <label for="automatic-check">$label_checking_automatic</label>
        <p class="help" id="automatic-check-help">$hint_checking_automatic</p>
      </div>
    </div>
  </div>
</div>
