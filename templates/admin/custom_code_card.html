  <details class="code-config" data-index="$toc_index" data-id="$id_snippet"$open>
    <summary class="code-summary">
      <span class="code-summary-name">$name_shown</span>
      <span class="code-summary-where">$summary_text</span>
      <span class="code-summary-state$css_class_off_m">$state</span>
    </summary>
    <div class="code-body">
      <div class="code-heading">
        <label class="row-flag"><input type="checkbox" class="code-active" $checked> $label_active</label>
        <button type="button" class="button button-text button-danger button-small" onclick="removeCustomCode(this)">$label_delete</button>
      </div>

      <label class="field-labelled"><span class="label-text">$label_name</span>
      <input type="text" class="code-name" value="$name" placeholder="$ph_name"></label>

      <div class="code-grid">
        <label class="field-labelled"><span class="label-text">$label_position</span>
          <select class="code-position">
            <optgroup label="$group_technical">
              <option value="head" $sel_head>$label_pos_head</option>
              <option value="body_start" $sel_body_start>$label_pos_body_start</option>
              <option value="body_end" $sel_body_end>$label_pos_body_end</option>
            </optgroup>
            <optgroup label="$group_visible">
              <option value="nav" $sel_nav>$label_pos_nav</option>
              <option value="after_header" $sel_after_header>$label_pos_after_header</option>
              <option value="sidebar" $sel_sidebar>$label_pos_sidebar</option>
              <option value="home_feed" $sel_home_feed$only_site>$label_pos_home_feed</option>
              <option value="article_start" $sel_article_start>$label_pos_article_start</option>
              <option value="article_middle" $sel_article_middle>$label_pos_article_middle</option>
              <option value="article_end" $sel_article_end>$label_pos_article_end</option>
              <option value="before_footer" $sel_before_footer>$label_pos_before_footer</option>
              <option value="anchor" $sel_anchor>$label_pos_anchor</option>
            </optgroup>
          </select>
        </label>
$lock_scope        <label class="field-labelled"><span class="label-text">$label_consent</span>
          <select class="code-consent">
            <option value="necessary" $sel_necessary>$label_consent_choice_necessary</option>
            <option value="statistics" $sel_statistics>$label_consent_choice_statistics</option>
            <option value="marketing" $sel_marketing>$label_consent_choice_marketing</option>
          </select>
        </label>
      </div>
      <div class="code-point"$point_hidden_m>
        <p class="code-point-row"><span class="code-point-label-text">$label_point:</span>
          <span class="code-point-text">$point_text</span></p>
        <button type="button" class="button button-small" onclick="openPointPicker(this)">$label_choose_point</button>
        <p class="hint code-help">$hint_point</p>
        <input type="hidden" class="code-anchor-point" value="$anchor_point">
        <input type="hidden" class="code-anchor-point-where" value="$anchor_point_where">
        <input type="hidden" class="code-anchor-point-label-text" value="$anchor_point_label_text">
        <input type="hidden" class="code-anchor-point-page" value="$anchor_point_page">
      </div>
      <p class="hint code-help">$hint_position</p>
      <p class="hint code-help">$hint_consent</p>

      <p class="field-title" aria-hidden="true">$label_code</p>
      <textarea class="code-text" rows="8" spellcheck="false" aria-label="$label_code" placeholder="&lt;script src=&quot;https://servizio.esempio.com/script.js&quot; async&gt;&lt;/script&gt;">$code</textarea>
    </div>
  </details>
