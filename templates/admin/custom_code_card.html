  <details class="codice-config" data-indice="$toc_index" data-id="$id_snippet"$open>
    <summary class="codice-sommario">
      <span class="codice-sommario-nome">$name_shown</span>
      <span class="codice-sommario-dove">$summary_text</span>
      <span class="codice-sommario-stato$css_class_off_m">$state</span>
    </summary>
    <div class="codice-corpo">
      <div class="codice-intestazione">
        <label class="riga-flag"><input type="checkbox" class="codice-attivo" $checked> $label_active</label>
        <button type="button" class="pulsante pulsante-testo pulsante-pericolo pulsante-piccolo" onclick="removeCustomCode(this)">$label_delete</button>
      </div>

      <label class="campo-etichettato"><span class="etichetta">$label_name</span>
      <input type="text" class="codice-nome" value="$name" placeholder="$ph_name"></label>

      <div class="codice-griglia">
        <label class="campo-etichettato"><span class="etichetta">$label_position</span>
          <select class="codice-posizione">
            <optgroup label="$group_technical">
              <option value="head" $sel_head>$label_pos_head</option>
              <option value="body_start" $sel_body_start>$label_pos_body_start</option>
              <option value="body_end" $sel_body_end>$label_pos_body_end</option>
            </optgroup>
            <optgroup label="$group_visible">
              <option value="nav" $sel_nav>$label_pos_nav</option>
              <option value="after_header" $sel_after_header>$label_pos_after_header</option>
              <option value="sidebar" $sel_sidebar>$label_pos_sidebar</option>
              <option value="home_feed" $sel_home_feed$only_site>$label_pos_home_feed</option>
              <option value="article_start" $sel_article_start>$label_pos_article_start</option>
              <option value="article_middle" $sel_article_middle>$label_pos_article_middle</option>
              <option value="article_end" $sel_article_end>$label_pos_article_end</option>
              <option value="before_footer" $sel_before_footer>$label_pos_before_footer</option>
              <option value="anchor" $sel_anchor>$label_pos_anchor</option>
            </optgroup>
          </select>
        </label>
$lock_scope        <label class="campo-etichettato"><span class="etichetta">$label_consent</span>
          <select class="codice-consenso">
            <option value="necessary" $sel_necessary>$label_consent_choice_necessary</option>
            <option value="statistics" $sel_statistics>$label_consent_choice_statistics</option>
            <option value="marketing" $sel_marketing>$label_consent_choice_marketing</option>
          </select>
        </label>
      </div>
      <div class="codice-punto"$point_hidden_m>
        <p class="codice-punto-riga"><span class="codice-punto-etichetta">$label_point:</span>
          <span class="codice-punto-testo">$point_text</span></p>
        <button type="button" class="pulsante pulsante-piccolo" onclick="openPointPicker(this)">$label_choose_point</button>
        <p class="hint codice-aiuto">$hint_point</p>
        <input type="hidden" class="codice-ancora" value="$anchor_point">
        <input type="hidden" class="codice-ancora-dove" value="$anchor_point_where">
        <input type="hidden" class="codice-ancora-etichetta" value="$anchor_point_label_text">
        <input type="hidden" class="codice-ancora-pagina" value="$anchor_point_page">
      </div>
      <p class="hint codice-aiuto">$hint_position</p>
      <p class="hint codice-aiuto">$hint_consent</p>

      <p class="campo-titolo" aria-hidden="true">$label_code</p>
      <textarea class="codice-testo" rows="8" spellcheck="false" aria-label="$label_code" placeholder="&lt;script src=&quot;https://servizio.esempio.com/script.js&quot; async&gt;&lt;/script&gt;">$code</textarea>
    </div>
  </details>
